# Rebuilds the site every night so date-dependent output stays current
# without a manual push: activities demote to "Previously" once their date
# passes (build.mjs computes "today" in Europe/Zurich), and the CV tenure
# months tick over. Commits only when the generated output actually changed.
name: Daily rebuild

on:
  schedule:
    # 23:05 UTC = 00:05 CET (winter) / 01:05 CEST (summer) — always shortly
    # after midnight in Europe/Zurich, so a day's demotions land that morning.
    - cron: '5 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - name: Commit and push if output changed
        run: |
          if git diff --quiet; then
            echo "No changes - nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Daily rebuild: refresh generated site"
          git push
