# Rebuilds the site every night so date-dependent output stays current
# without a manual push: activities demote to "Previously" once their date
# passes (build.mjs computes "today" in Europe/Zurich), and the CV tenure
# months tick over. A second run by day pulls new Business Mission Control
# episodes from the YouTube playlist into content/projects.json first. Commits
# only when the content or the generated output actually changed. A sync
# skipped three days in a row turns the day run red, after the push.
name: Daily rebuild

on:
  schedule:
    # 23:05 UTC = 00:05 CET (winter) / 01:05 CEST (summer) — always shortly
    # after midnight in Europe/Zurich, so a day's demotions land that morning.
    # GitHub starts scheduled runs late: this one has landed 01:00-04:40 UTC.
    - cron: '5 23 * * *'
    # 13:17 UTC, the episode sync. The playlist feed answers 404 through most
    # of the night, which is when the run above lands. Measured from runners
    # (WI #249): 22 of 138 requests answered between 23:00 and 04:46 UTC, and
    # every request by day. Episodes go out around 10:00-12:30 UTC, so they
    # appear the same day.
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      # Every run syncs except the nightly one, including a manual run.
      SYNC: ${{ github.event.schedule != '5 23 * * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore the count of skipped syncs
        # Cache entries can't be overwritten, so each run saves its own and the
        # next run restores the newest through the prefix.
        if: env.SYNC == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .sync-skips
          key: sync-skips-${{ github.run_id }}
          restore-keys: sync-skips-
      - name: Sync podcast episodes from the playlist feed
        # The script already exits 0 on any feed problem and leaves the file
        # untouched; continue-on-error and the timeout are the backstop. A
        # YouTube outage can only ever cost today's new episodes, never the
        # rebuild. A skipped sync shows as a warning on the run's summary page
        # and adds one to .sync-skips; a sync that works sets it back to 0.
        if: env.SYNC == 'true'
        run: node sync-episodes.mjs --skips-file .sync-skips
        continue-on-error: true
        timeout-minutes: 2
      - run: node build.mjs
      - name: Commit and push if output changed
        run: |
          if git diff --quiet; then
            echo "No changes - nothing to publish."
            exit 0
          fi
          msg="Daily rebuild: refresh generated site"
          if ! git diff --quiet -- content/projects.json; then
            msg="Daily rebuild: add new podcast episodes"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$msg"
          git push
      - name: Save the count of skipped syncs
        if: always() && env.SYNC == 'true'
        uses: actions/cache/save@v4
        with:
          path: .sync-skips
          key: sync-skips-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fail the run if the sync keeps being skipped
        # Last on purpose: the site is already built and pushed, so a red run
        # here costs nothing. It turns red from the third skipped sync in a row
        # until a sync works again, and GitHub notifies about failed runs. The
        # nightly run neither syncs nor counts, so the night alone never trips it.
        if: env.SYNC == 'true'
        run: node sync-episodes.mjs --check-skips .sync-skips
